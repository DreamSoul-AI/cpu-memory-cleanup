[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-memory-cleanup"
version = "0.2.0"
description = "Windows CPU 与内存观察、离线分析和显式单项维护工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpu_memory_cleanup", "cpu_memory_cleanup.*"]

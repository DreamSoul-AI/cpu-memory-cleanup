[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cpu-memory-cleanup"
version = "0.2.0"
description = "Reusable memory status, explicit cleanup and record review with CLI and desktop adapters"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
keywords = ["memory", "windows", "cli", "agent-tool"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Homepage = "https://github.com/DreamSoul-AI/cpu-memory-cleanup"
Repository = "https://github.com/DreamSoul-AI/cpu-memory-cleanup"
Issues = "https://github.com/DreamSoul-AI/cpu-memory-cleanup/issues"
Releases = "https://github.com/DreamSoul-AI/cpu-memory-cleanup/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cpu_memory_cleanup", "cpu_memory_cleanup.*"]

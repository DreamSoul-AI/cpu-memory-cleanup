name: macOS readonly verification
on:
  workflow_dispatch:
  push:
    branches: [codex/install-agent-platform]
    paths: [.github/workflows/macos-readonly.yml]
permissions:
  contents: read
jobs:
  readonly:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run macOS readonly]')
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Native environment and isolated tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results/macos-readonly
          { sw_vers; uname -m; rustc --version; cargo --version; node --version; git rev-parse HEAD; } > .test-results/macos-readonly/environment.txt
          cargo fmt --all -- --check > .test-results/macos-readonly/format.txt 2>&1
          cargo clippy --all-targets --locked -- -D warnings > .test-results/macos-readonly/clippy.txt 2>&1
          cargo clippy --all-targets --features experimental-quota --locked -- -D warnings > .test-results/macos-readonly/clippy-feature.txt 2>&1
          cargo test --lib --test '*' --locked > .test-results/macos-readonly/rust-tests.txt 2>&1
          cargo test --lib --test '*' --features experimental-quota --locked > .test-results/macos-readonly/rust-feature-tests.txt 2>&1
          node --test tests/interaction/web_assets/*.test.cjs > .test-results/macos-readonly/web-tests.txt 2>&1
          cargo build --release --locked > .test-results/macos-readonly/build.txt 2>&1
      - name: Build and extract native portable candidate
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-macos.sh .test-results/macos-readonly/package
          mkdir -p ".test-results/macos-readonly/Portable check"
          tar -xzf .test-results/macos-readonly/package/*.tar.gz -C ".test-results/macos-readonly/Portable check"
      - name: Actual native readonly probe
        shell: bash
        run: |
          set -euo pipefail
          binary=$(find ".test-results/macos-readonly/Portable check" -type f -name cpu-memory-cleanup)
          launcher=$(find ".test-results/macos-readonly/Portable check" -type f -name run.command)
          python3 scripts/macos-probe.py --binary "$binary" --launcher "$launcher" --output-dir .test-results/macos-readonly/probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-readonly-${{ github.sha }}
          path: .test-results/macos-readonly
          retention-days: 7
          if-no-files-found: error
